daq_settings:
  timebase: 1
  channels:
    - enable: true
      name: Dev2/ai0
      terminal_config: RSE
      probe_attenuation: 1.0
      coupling: DC
      volts_per_div: 1.0
      vertical_offset: 0.0
    - enable: false
      name: Dev2/ai1
      terminal_config: RSE
      probe_attenuation: 1.0
      coupling: DC
      volts_per_div: 0.1
      vertical_offset: 0.0
    - enable: false
      name: Dev2/ai2
      terminal_config: RSE
      probe_attenuation: 1.0
      coupling: DC
      volts_per_div: 0.1
      vertical_offset: 0.0
    - enable: false
      name: Dev2/ai3
      terminal_config: RSE
      probe_attenuation: 1.0
      coupling: DC
      volts_per_div: 0.1
      vertical_offset: 0.0

processor_settings:
  trigger_type: normal
  trigger_level: 0.1
  trigger_offset: 0
  trigger_slope: rising
  trigger_channel: 0
  measurements:
    - mean: true        # channel 0
      rms: false
      min: false
      max: false
      peak_to_peak: false
      frequency: true
      rise_time: false
      fall_time: false
    - mean: false        # channel 1
      rms: false
      min: false
      max: false
      peak_to_peak: false
      frequency: false
      rise_time: false
      fall_time: false
    - mean: false        # channel 2
      rms: false
      min: false
      max: false
      peak_to_peak: false
      frequency: false
      rise_time: false
      fall_time: false
    - mean: false        # channel 3
      rms: false
      min: false
      max: false
      peak_to_peak: false
      frequency: false
      rise_time: false
      fall_time: false

signal_gen_settings:
  gpib_address: 10
  waveform: SIN
  frequency: 1000.0       # Hz
  amplitude: 1.0          # Vpp
  offset: 0.0             # V
  load: INF               # INF = High-Z, 50 = 50 Ω
  duty_cycle: 50.0        # % — only active when waveform = SQU
  output_enabled: false

app_settings:
  save_on_exit: true      # if true, settings are saved automatically when the app closes
                          # if false, only the Save button saves settings
